<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:;" />
    <title>xoBnoisseS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="tabstrip"></div>
    <div id="toolbar">
      <div class="nav-group">
        <button id="btn-back" title="Kembali">‹</button>
        <button id="btn-forward" title="Maju">›</button>
        <button id="btn-reload" title="Muat ulang">⟳</button>
      </div>
      <input id="address" type="text" spellcheck="false" placeholder="Ketik alamat atau cari…" />
      <button id="btn-panel" title="Panel sesi">Sesi</button>
    </div>

    <aside id="panel" class="hidden">
      <div class="panel-section">
        <div class="panel-label">Tab saat ini</div>
        <div id="current-tab" class="current-tab">—</div>
        <button id="btn-save-tab" class="primary block">Simpan tab ini sebagai sesi</button>
        <button id="btn-new-empty" class="block">+ Sesi kosong baru</button>
      </div>
      <div class="panel-section grow">
        <div class="panel-label">Sesi tersimpan</div>
        <div id="session-list"></div>
      </div>
    </aside>

    <div id="modal-backdrop" class="hidden">
      <div id="modal"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
